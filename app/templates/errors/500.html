{% extends "base.html" %}

{% block title %}Server Error (500) | ApnaVision{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8">
    <div class="text-center">
        <p class="text-sm font-semibold text-red-600 uppercase tracking-wide">500 error</p>
        <h1 class="mt-2 text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">Internal Server Error.</h1>
        <p class="mt-2 text-base text-gray-500">Sorry, something went wrong on our end.</p>
        <div class="mt-6 text-center">
            <a href="/" class="text-base font-medium text-volt-600 hover:text-volt-500">
                Go back home <span aria-hidden="true">&rarr;</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
